<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do auto center</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#0b0b0c}
a{color:#ffc800}a:hover{color:#e0ae00}
.d{font-family:'Barlow Condensed',sans-serif}
.st{padding:0 10px 16px;border-left:1px solid #2a2a2f}
.st:first-child{padding-left:0;border-left:0}
.sv{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:46px;font-weight:800;line-height:1}
.sl{margin:4px 0 0;font-size:14px;color:#9b9aa2}
.vrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #2a2a2f}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;color:#9b9aa2;text-decoration:none;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600}
.tab:hover{color:#f2efe8}
.tabOn{color:#ffc800}
</style>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #131315; color: #f2efe8; font-family: 'Barlow', sans-serif">
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid #2a2a2f">
      <div style="display: flex; width: 46px; height: 46px; flex-shrink: 0; border: 2px solid #ffc800; border-radius: 10px; background: #26262a; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffc800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
      </div>
      <div style="min-width: 0">
        <span style="display: inline-block; padding: 2px 7px; border-radius: 6px; background: #ffc800; color: #17171a; font-size: 13px; font-weight: 600">Auto center</span>
        <p class="d" style="margin: 2px 0 0; font-size: 26px; font-weight: 800; line-height: 1">Auto Center Parnaíba</p>
      </div>
    </div>

    <section aria-label="Resumo de hoje" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px dashed #34343a">
      <div class="st"><p class="sv" style="color: #ffc800">6</p><p class="sl">cupons hoje</p></div>
      <div class="st"><p class="sv" style="color: #ff8a3d">4,9</p><p class="sl">nota (38)</p></div>
      <div class="st"><p class="sv">2</p><p class="sl">a avaliar</p></div>
    </section>

    <section style="padding: 16px; border: 2px dashed #ffc800; border-radius: 14px; background: #0d0d0f; display: flex; flex-direction: column; gap: 10px">
      <h1 class="d" style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1">Validar cupom no balcão</h1>
      <a href="Validado.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; border-radius: 10px; background: #ffc800; color: #17171a; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg>Escanear QR do cupom
      </a>
      <div style="display: flex; gap: 8px">
        <label for="cod" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Código do cupom</label>
        <input id="cod" placeholder="Ou digite o código" style="flex: 1; min-width: 0; min-height: 50px; box-sizing: border-box; padding: 0 12px; border: 1px solid #34343a; border-radius: 10px; background: #1c1c1f; color: #ffc800; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.04em">
        <button type="button" style="min-height: 50px; padding: 0 16px; border: 1px solid #ffc800; border-radius: 10px; background: transparent; color: #ffc800; font-family: 'Barlow', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">Validar</button>
      </div>
    </section>

    <section>
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 class="d" style="margin: 0; font-size: 26px; font-weight: 700">Hoje no balcão</h2>
        <a href="Relatorio.html" style="font-size: 15px; font-weight: 600">Ver tudo</a>
      </div>
      <div class="vrow">
        <span style="flex: 1"><span style="display: block; font-size: 16px; font-weight: 600">Nestor H., ABC1D23</span><span style="font-size: 14px; color: #9b9aa2">Alinhamento 3D, 10:40</span></span>
        <a href="Avaliar.html" style="display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 8px; background: #ff8a3d; color: #17171a; text-decoration: none; font-size: 15px; font-weight: 600">Avaliar</a>
      </div>
      <div class="vrow">
        <span style="flex: 1"><span style="display: block; font-size: 16px; font-weight: 600">Carlos M., QRS4E56</span><span style="font-size: 14px; color: #9b9aa2">Troca de óleo, 09:15</span></span>
        <span style="font-size: 14px; font-weight: 600; color: #43d17a">Avaliado</span>
      </div>
    </section>
  </div>

  <nav aria-label="Navegação do auto center" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 20px; background: #1c1c1f; border-top: 1px solid #2a2a2f">
    <a href="Painel.html" class="tab tabOn" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><path d="M7 12h10"></path></svg>Balcão</a>
    <a href="NovaOferta.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"></path><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>Ofertas</a>
    <a href="Relatorio.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg>Relatório</a>
    <a href="CadastroAutoCenter.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path></svg>Oficina</a>
  </nav>
</div>
</body>
</html>

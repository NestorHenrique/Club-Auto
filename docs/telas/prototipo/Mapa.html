<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de oficinas</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#0b0b0c}
a{color:#ffc800}a:hover{color:#e0ae00}
.d{font-family:'Barlow Condensed',sans-serif}
.pin{position:absolute;display:flex;flex-direction:column;align-items:center;border:0;background:transparent;padding:0;cursor:pointer}
.pinTag{padding:5px 9px 3px;border-radius:7px;background:#f2efe8;color:#17171a;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;line-height:1;box-shadow:0 6px 14px -6px rgba(0,0,0,.8)}
.pinOn .pinTag{background:#ffc800;transform:scale(1.15)}
.pinStem{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid #f2efe8}
.pinOn .pinStem{border-top-color:#ffc800;margin-top:2px}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;color:#9b9aa2;text-decoration:none;font-family:'Barlow',sans-serif;font-size:13px;font-weight:600}
.tab:hover{color:#f2efe8}
.tabOn{color:#ffc800}
</style>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #1a1a1d; color: #f2efe8; font-family: 'Barlow', sans-serif">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0">
    <rect width="390" height="844" fill="#1a1a1d"></rect>
    <path d="M-20 120 C 80 150, 120 90, 220 130 S 360 200, 420 170" stroke="#1d3350" stroke-width="38" fill="none"></path>
    <g stroke="#2c2c31" stroke-width="10" fill="none" stroke-linecap="round">
      <path d="M0 300 L390 260"></path><path d="M0 430 L390 470"></path><path d="M60 180 L120 700"></path><path d="M250 160 L300 700"></path><path d="M0 600 L390 560"></path>
    </g>
    <g stroke="#232327" stroke-width="5" fill="none">
      <path d="M0 360 L390 350"></path><path d="M180 180 L190 700"></path><path d="M330 200 L360 700"></path><path d="M0 520 L390 510"></path><path d="M20 220 L40 700"></path>
    </g>
    <path d="M0 300 L390 260" stroke="#3a3a40" stroke-width="14" fill="none"></path>
    <text x="210" y="252" fill="#75747c" font-family="Barlow, sans-serif" font-size="13" transform="rotate(-6 210 252)">Av. São Sebastião</text>
    <text x="40" y="112" fill="#4f6d94" font-family="Barlow, sans-serif" font-size="13" font-style="italic">Rio Igaraçu</text>
  </svg>

  <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; gap: 8px">
    <div style="flex: 1; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; border: 1px solid #34343a; border-radius: 10px; background: #131315; color: #9b9aa2; font-size: 16px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>Oficinas perto de você
    </div>
    <button type="button" aria-label="Filtrar por serviço" style="display: flex; width: 50px; height: 50px; border: 1px solid #34343a; border-radius: 10px; background: #131315; color: #f2efe8; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M7 12h10"></path><path d="M10 18h4"></path></svg></button>
  </div>

  <button type="button" class="pin pinOn" aria-label="Auto Center Parnaíba, até 40% de desconto" style="left: 196px; top: 212px"><span class="pinTag">-40%</span><span class="pinStem"></span></button>
  <button type="button" class="pin" aria-label="Pneus Delta, até 20% de desconto" style="left: 60px; top: 330px"><span class="pinTag">-20%</span><span class="pinStem"></span></button>
  <button type="button" class="pin" aria-label="Lava Jato Litoral, até 33% de desconto" style="left: 285px; top: 400px"><span class="pinTag">-33%</span><span class="pinStem"></span></button>
  <button type="button" class="pin" aria-label="Posto Igaraçu, até 8% de desconto" style="left: 120px; top: 470px"><span class="pinTag">-8%</span><span class="pinStem"></span></button>

  <span aria-label="Você está aqui" role="img" style="position: absolute; left: 170px; top: 360px; width: 18px; height: 18px; border-radius: 50%; background: #6ca6ff; border: 3px solid #f2efe8; box-shadow: 0 0 0 10px rgba(108,166,255,.22)"></span>

  <div style="position: absolute; left: 12px; right: 12px; bottom: 96px; padding: 16px; border-radius: 16px; background: #131315; border: 1px solid #34343a; box-shadow: 0 -10px 30px -10px rgba(0,0,0,.7); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; gap: 12px">
      <div>
        <p style="margin: 0; font-size: 18px; font-weight: 600">Auto Center Parnaíba</p>
        <p style="margin: 2px 0 0; display: flex; align-items: center; gap: 6px; font-size: 15px; color: #9b9aa2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#ff8a3d" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"></path></svg>4,9, a 1,2 km, aberto até 18:00
        </p>
      </div>
      <span class="d" style="font-size: 15px; font-weight: 600; color: #9b9aa2; white-space: nowrap">4 ofertas</span>
    </div>
    <a href="Oferta.html" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 10px; background: #ffc800; color: #17171a; text-decoration: none">
      <span style="display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 600">Melhor oferta agora</span>
        <span class="d" style="font-size: 22px; font-weight: 700; line-height: 1.05">Alinhamento 3D por R$ 90,00</span>
      </span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </a>
    <div style="display: flex; gap: 8px">
      <a href="Ofertas.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 46px; border: 1px solid #34343a; border-radius: 10px; color: #f2efe8; text-decoration: none; font-size: 15px; font-weight: 600">Ver todas</a>
      <a href="#" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; border: 1px solid #34343a; border-radius: 10px; color: #f2efe8; text-decoration: none; font-size: 15px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 19-9-9 19-2-8z"></path></svg>Rota</a>
    </div>
  </div>

  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 20px; background: #1c1c1f; border-top: 1px solid #2a2a2f">
    <a href="Ofertas.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"></path><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>Ofertas</a>
    <a href="Mapa.html" class="tab tabOn" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 5-5.5 10.2-7.4 11.8a1 1 0 0 1-1.2 0C9.5 20.2 4 15 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>Mapa</a>
    <a href="MeusCupons.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2"></path><path d="M13 17v2"></path><path d="M13 11v2"></path></svg>Cupons</a>
    <a href="Perfil.html" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Perfil</a>
  </nav>
</div>
</body>
</html>

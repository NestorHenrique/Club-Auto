<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#0b0b0c}
a{color:#ffc800}a:hover{color:#e0ae00}
.otp{width:44px;height:56px;box-sizing:border-box;border:1px solid #34343a;border-radius:10px;background:#0d0d0f;color:#ffc800;font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;text-align:center}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 20px 32px; background: #131315; color: #f2efe8; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; gap: 24px">
  <a href="Entrada.html" aria-label="Voltar" style="display: flex; width: 46px; height: 46px; border: 1px solid #34343a; border-radius: 10px; align-items: center; justify-content: center; color: #f2efe8">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
  </a>

  <div>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 800; line-height: 1">Entrar</h1>
    <p style="margin: 8px 0 0; font-size: 17px; line-height: 1.45; color: #9b9aa2">Enviamos um código para o seu celular. Sem senha para lembrar.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="tel" style="font-size: 15px; font-weight: 600; color: #d4d1c9">Celular com DDD</label>
    <div style="display: flex; gap: 8px">
      <span style="display: flex; align-items: center; padding: 0 14px; min-height: 52px; border: 1px solid #34343a; border-radius: 10px; background: #1c1c1f; font-size: 16px; color: #9b9aa2">+55</span>
      <input id="tel" type="tel" value="(86) 99999-8888" style="flex: 1; min-width: 0; min-height: 52px; box-sizing: border-box; padding: 0 14px; border: 1px solid #ffc800; border-radius: 10px; background: #0d0d0f; color: #f2efe8; font-family: 'Barlow', sans-serif; font-size: 17px">
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 18px 16px; border-radius: 14px; background: #1c1c1f">
    <p style="margin: 0; font-size: 15px; color: #d4d1c9">Código enviado por WhatsApp para (86) 99999-8888</p>
    <div style="display: flex; justify-content: space-between">
      <input class="otp" aria-label="Dígito 1" value="4"><input class="otp" aria-label="Dígito 2" value="8"><input class="otp" aria-label="Dígito 3" value="1"><input class="otp" aria-label="Dígito 4" value=""><input class="otp" aria-label="Dígito 5" value=""><input class="otp" aria-label="Dígito 6" value="">
    </div>
    <p style="margin: 0; font-size: 15px; color: #9b9aa2">Reenviar código em 0:42</p>
  </div>

  <button type="button" style="min-height: 54px; border: 0; border-radius: 10px; background: #ffc800; color: #17171a; font-family: 'Barlow Condensed', sans-serif; font-size: 23px; font-weight: 700; cursor: pointer">Entrar</button>

  <div style="display: flex; align-items: center; gap: 12px; color: #75747c; font-size: 15px">
    <span style="flex: 1; height: 1px; background: #2a2a2f"></span>ou<span style="flex: 1; height: 1px; background: #2a2a2f"></span>
  </div>

  <button type="button" style="min-height: 50px; border: 1px solid #34343a; border-radius: 10px; background: transparent; color: #f2efe8; font-family: 'Barlow', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer">Entrar com e-mail e senha</button>

  <p style="margin: auto 0 0; text-align: center; font-size: 16px; color: #9b9aa2">Ainda não tem conta? <a href="Entrada.html" style="font-weight: 600">Criar conta</a></p>
</div>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boas-vindas</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:#0b0b0c}
a{color:#ffc800}a:hover{color:#e0ae00}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 20px 40px; background: #131315; color: #f2efe8; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; gap: 32px">
  <div>
    <p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1">Clube Auto</p>
    <div style="display: flex; gap: 3px; margin-top: 5px" aria-hidden="true">
      <span style="width: 16px; height: 3px; background: #ffc800"></span><span style="width: 16px; height: 3px; background: #ffc800"></span><span style="width: 16px; height: 3px; background: #ffc800"></span>
    </div>
  </div>

  <div>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 52px; font-weight: 800; line-height: 0.98">Economize na manutenção do carro que te dá o sustento.</h1>
    <p style="margin: 14px 0 0; font-size: 17px; line-height: 1.45; color: #9b9aa2">Cupons de desconto em oficinas parceiras de Parnaíba. Como você vai usar?</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <a href="CadastroMotorista.html" style="display: flex; align-items: center; gap: 16px; padding: 18px 16px; border-radius: 14px; background: #ffc800; color: #17171a; text-decoration: none">
      <span style="display: flex; width: 48px; height: 48px; border-radius: 10px; background: #17171a; color: #ffc800; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9L18 10l-2.7-3.6A2 2 0 0 0 13.7 6H7.3a2 2 0 0 0-1.7 1L4 10l-1.5 1.1C1.7 11.3 1 12.1 1 13v3c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><circle cx="17" cy="17" r="2"></circle><path d="M9 17h6"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.05">Sou motorista</span>
        <span style="font-size: 15px; font-weight: 500">Ver ofertas e gerar cupons</span>
      </span>
    </a>

    <a href="CadastroAutoCenter.html" style="display: flex; align-items: center; gap: 16px; padding: 18px 16px; border-radius: 14px; background: #1c1c1f; border: 1px solid #34343a; color: #f2efe8; text-decoration: none">
      <span style="display: flex; width: 48px; height: 48px; border-radius: 10px; background: #26262a; color: #ffc800; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.05">Tenho um auto center</span>
        <span style="font-size: 15px; color: #9b9aa2">Publicar ofertas e validar cupons</span>
      </span>
    </a>
  </div>

  <p style="margin: auto 0 0; text-align: center; font-size: 16px; color: #9b9aa2">Já tem conta? <a href="Login.html" style="font-weight: 600">Entrar</a></p>
</div>
</body>
</html>

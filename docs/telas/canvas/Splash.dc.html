body{margin:0}
.ic{position:relative;width:5em;height:5em;border-radius:1.15em;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#ffc800}
.tk{position:relative;width:3.5em;height:2.15em;border-radius:.26em;transform:rotate(-10deg);display:flex;align-items:center;background:#17171a}
.tk::before,.tk::after{content:"";position:absolute;top:50%;width:.6em;height:.6em;margin-top:-.3em;border-radius:50%;background:#ffc800}
.tk::before{left:-.3em}.tk::after{right:-.3em}
.perf{position:absolute;left:2.3em;top:.28em;bottom:.28em;border-left:.075em dashed rgba(255,200,0,.6)}
.pcw{width:2.3em;display:flex;justify-content:center}
.pc{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.55em;line-height:1;color:#ffc800}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 0 32px 56px; background: #131315; color: #f2efe8; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0">

    <div class="ic" style="font-size: 24px"><div class="tk"><span class="pcw"><span class="pc">%</span></span><span class="perf"></span></div></div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
      <p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1">Clube Auto</p>
      <div style="display: flex; gap: 5px" aria-hidden="true">
        <span style="width: 22px; height: 4px; border-radius: 1px; background: #ffc800"></span>
        <span style="width: 22px; height: 4px; border-radius: 1px; background: #ffc800; opacity: 0.55"></span>
        <span style="width: 22px; height: 4px; border-radius: 1px; background: #ffc800; opacity: 0.25"></span>
      </div>
    </div>
  </div>
  <p style="margin: 0; max-width: 26ch; text-align: center; font-size: 16px; line-height: 1.4; color: #9b9aa2">Desconto em oficinas parceiras para quem roda por aplicativo</p>
</div>

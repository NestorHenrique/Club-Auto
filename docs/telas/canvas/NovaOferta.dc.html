<!doctype html>

<style>
body{margin:0}
a{color:#ffc800}a:hover{color:#e0ae00}
.d{font-family:'Barlow Condensed',sans-serif}
.lbl{font-size:15px;font-weight:600;color:#d4d1c9}
.inp{width:100%;min-height:48px;box-sizing:border-box;padding:0 12px;border:1px solid #34343a;border-radius:10px;background:#0d0d0f;color:#f2efe8;font-family:'Barlow',sans-serif;font-size:16px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.sb{display:flex;width:44px;height:44px;border:1px solid #34343a;border-radius:10px;background:transparent;color:#f2efe8;align-items:center;justify-content:center;cursor:pointer}
.perf{position:relative;height:0;border-top:2px dashed rgba(23,23,26,.25);margin:0 12px}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:#131315}
.perf::before{left:-21px}.perf::after{right:-21px}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 24px; background: #131315; color: #f2efe8; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Painel.dc.html" aria-label="Voltar ao balcão" style="display: flex; width: 46px; height: 46px; flex-shrink: 0; border: 1px solid #34343a; border-radius: 10px; align-items: center; justify-content: center; color: #f2efe8">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>

      <p style="margin: 0; font-size: 13px; font-weight: 600; color: #6b6a62">Assim os motoristas vão ver</p>
      <p class="d" style="margin: 2px 0 0; font-size: 22px; font-weight: 700; line-height: 1.05">Troca de pastilhas de freio dianteiras</p>
    </div>
    <div class="perf" aria-hidden="true"></div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 10px 14px 12px">
      <div><span style="display: block; font-size: 13px; color: #6b6a62; text-decoration: line-through">De R$ 280,00</span><span class="d" style="font-size: 34px; font-weight: 800; line-height: 1">R$ 210,00</span></div>

    </div>
  </div>

  <div class="f"><label class="lbl" for="tit">Serviço ou peça</label><input id="tit" class="inp" value="Troca de pastilhas de freio dianteiras"></div>

  <div class="f"><label class="lbl" for="cat">Categoria</label>
    <select id="cat" class="inp"><option>Freios</option><option>Alinhamento e suspensão</option><option>Óleo e filtros</option><option>Pneus e rodas</option><option>Lavagem e estética</option></select>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <div class="f"><label class="lbl" for="pn">Normal (R$)</label><input id="pn" class="inp" value="280,00" inputmode="decimal"></div>
    <div class="f"><label class="lbl" for="pp">Promocional (R$)</label><input id="pp" class="inp" value="210,00" inputmode="decimal" style="border-color: #ffc800; color: #ffc800; font-weight: 600"></div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <span class="lbl" id="lim">Quantos cupons liberar</span>
    <div role="group" aria-labelledby="lim" style="display: flex; align-items: center; gap: 10px">

  <button type="button" style="margin-top: auto; min-height: 54px; border: 0; border-radius: 10px; background: #ffc800; color: #17171a; font-family: 'Barlow Condensed', sans-serif; font-size: 23px; font-weight: 700; cursor: pointer">Publicar oferta</button>
</div>

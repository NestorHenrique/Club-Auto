<x-dc>

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffc800}a:hover{color:#e0ae00}
.d{font-family:'Barlow Condensed',sans-serif}
.star{display:flex;width:56px;height:56px;border:0;border-radius:10px;background:transparent;align-items:center;justify-content:center;cursor:pointer}
.chip{display:inline-flex;align-items:center;min-height:42px;padding:0 13px;border:1px solid #34343a;border-radius:6px;background:transparent;color:#f2efe8;font-family:'Barlow',sans-serif;font-size:15px;font-weight:600}
.chipOn{background:#ff8a3d;border-color:#ff8a3d;color:#17171a}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0b0b0c; color: #f2efe8; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; justify-content: flex-end">
  <div style="position: absolute; top: 24px; left: 16px; right: 16px; opacity: 0.35" aria-hidden="true">
    <p class="d" style="margin: 0; font-size: 26px; font-weight: 800; text-transform: uppercase">Clube Auto</p>
    <p class="d" style="margin: 24px 0 0; font-size: 58px; font-weight: 800; color: #ffc800; line-height: 1">R$ 135,00</p>
  </div>

  <div role="dialog" aria-modal="true" aria-label="Avaliar serviço" style="position: relative; padding: 24px 20px 28px; background: #1c1c1f; border-top: 4px solid #ff8a3d; border-radius: 6px 6px 0 0; display: flex; flex-direction: column; gap: 16px">
    <div>
      <p style="margin: 0; font-size: 15px; color: #9b9aa2">Auto Center Parnaíba, hoje às 10:40</p>
      <h1 class="d" style="margin: 4px 0 0; font-size: 34px; font-weight: 800; line-height: 1">Como foi o alinhamento?</h1>
    </div>

    <div role="radiogroup" aria-label="Nota" style="display: flex; justify-content: space-between">
      <button type="button" class="star" role="radio" aria-checked="false" aria-label="1 estrela"><svg width="40" height="40" viewBox="0 0 24 24" fill="#ff8a3d" stroke="#ff8a3d" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"></path></svg></button>
      <button type="button" class="star" role="radio" aria-checked="false" aria-label="2 estrelas"><svg width="40" height="40" viewBox="0 0 24 24" fill="#ff8a3d" stroke="#ff8a3d" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"></path></svg></button>
      <button type="button" class="star" role="radio" aria-checked="false" aria-label="3 estrelas"><svg width="40" height="40" viewBox="0 0 24 24" fill="#ff8a3d" stroke="#ff8a3d" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"></path></svg></button>
      <button type="button" class="star" role="radio" aria-checked="true" aria-label="4 estrelas"><svg width="40" height="40" viewBox="0 0 24 24" fill="#ff8a3d" stroke="#ff8a3d" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"></path></svg></button>
      <button type="button" class="star" role="radio" aria-checked="false" aria-label="5 estrelas"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4a4a52" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"></path></svg></button>
    </div>
    <p style="margin: -6px 0 0; text-align: center; font-size: 16px; font-weight: 600; color: #ff8a3d">Muito bom</p>

    <fieldset style="margin: 0; padding: 0; border: 0">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 15px; font-weight: 600; color: #d4d1c9">O que se destacou?</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" class="chip chipOn" aria-pressed="true">Rápido</button>
        <button type="button" class="chip chipOn" aria-pressed="true">Preço combinado</button>
        <button type="button" class="chip" aria-pressed="false">Bom atendimento</button>
        <button type="button" class="chip" aria-pressed="false">Explicou o serviço</button>
        <button type="button" class="chip" aria-pressed="false">Demorou</button>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="coment" style="font-size: 15px; font-weight: 600; color: #d4d1c9">Comentário (opcional)</label>
      <textarea id="coment" rows="2" placeholder="Ex: Entregaram antes do combinado." style="box-sizing: border-box; width: 100%; padding: 12px 14px; border: 1px solid #34343a; border-radius: 10px; background: #0d0d0f; color: #f2efe8; font-family: 'Barlow', sans-serif; font-size: 16px; resize: none"></textarea>
    </div>

    <button type="button" style="min-height: 54px; border: 0; border-radius: 10px; background: #ffc800; color: #17171a; font-family: 'Barlow Condensed', sans-serif; font-size: 23px; font-weight: 700; cursor: pointer">Enviar avaliação</button>
    <button type="button" style="min-height: 44px; border: 0; background: transparent; color: #9b9aa2; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Avaliar depois</button>
  </div>
</div>
</x-dc>
